; https://docs.platformio.org/en/latest/platforms/espressif32.html

[platformio]
; uncomment to build only specific envs instead all different board variants
; default_envs = esp32_p4_r3
boards_dir = ./boards
extra_configs =
    ; place your global library dependencies here, it will use in all envs
    extra_configs/lib_deps.ini
    ; base envs to extend from, e.g. for different board variants
    extra_configs/base_envs.ini
    ; place extra configuration options here, you can reuse in other envs via ${extra.config_name}
    extra_configs/extra.ini
; uncomment to build an example otherwise the src/main.cpp is in place
; src_dir = ./examples/encoder
; src_dir = ./examples/deep-sleep-encoder-wakeup
; src_dir = ./examples/light-sleep-encoder-wakeup

[env]
; use community compatible fork, see pioarduino versions, supports new boards
; see https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; uncomment platformIO platform and replace above if you prefer to use platformIO instead of the community compatible fork
; stable version:
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; or use a version: https://github.com/platformio/platform-espressif32/releases
; platform = ${extra.platformio_platform}

; Possible values: "littlefs", "spiffs", "fatfs"
board_build.filesystem = littlefs

build_flags =
    ; to use e.g. as part of the firmware name 
    '-DPIOENV="${PIOENV}"'
 
    ; coding_standards
    ; works only with platformio and not pioarduino
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wunreachable-code

    ; debug level 5=VERBOSE https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
    ;  -DCORE_DEBUG_LEVEL=5

    ; config flags, e.g. to enable features in a config.h
    -I lib/config
extra_scripts = pre:extra_script.py
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; uncomment and configure when you have multiple ESPs connected
; upload_port = /dev/tty.usbserial-...
; monitor_port = /dev/tty.usbserial-...

; ************
; * ESP32-S3 *
; ************

; ESP32-S3 board config with 16MB flash
[env:esp32_s3_crowpanel_2_1]
extends = esp32s3
board = esp32-s3-devkitc-1
board_build.variant = ${PIOENV}
board_build.variants_dir = variants
board_build.partitions = partitions/partitions_16mb_ota_phy.csv
